<!DOCTYPE html>

<style>
:root{--page:#ECEEEC;--surface:#FFFFFF;--ink:#22262B;--muted:#68707A;--line:#D8DCD8;--soft:#F4F5F4;--accent:#2E4A62;--accent-ink:#FFFFFF;--danger:#B3261E;--ok:#2F6B3A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#16181B;--surface:#1F2226;--ink:#ECEEF0;--muted:#9AA1AA;--line:#33373D;--soft:#26292E;--accent:#8FB3D1;--accent-ink:#10202C;--danger:#F2B8B5;--ok:#9BD0A5}}
:root[data-theme="dark"]{--page:#16181B;--surface:#1F2226;--ink:#ECEEF0;--muted:#9AA1AA;--line:#33373D;--soft:#26292E;--accent:#8FB3D1;--accent-ink:#10202C;--danger:#F2B8B5;--ok:#9BD0A5}html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*::before,*::after{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--page);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}button,input{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.va{fill:var(--a)}.vb{fill:var(--b)}.vc{fill:var(--c)}.vbs{stroke:var(--b)}.vcs{stroke:var(--c)}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}header{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;padding:14px 20px;flex-wrap:wrap}header h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}.tabs{display:flex;gap:2px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;overflow-x:auto;max-width:100%;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:none;border:0;background:transparent;padding:7px 14px;border-radius:7px;color:var(--muted);font-size:13px;white-space:nowrap}.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:0 20px 20px;min-height:0}.stage{display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}.stage-bar{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line)}.stage-bar .t{flex:1;min-width:0}.stage-bar h2{margin:0;font-size:15px;font-weight:600}.stage-bar p{margin:0;font-size:12px;color:var(--muted)}.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}.icon-btn:hover{background:var(--soft)}.icon-btn svg{width:18px;height:18px}.nav-btn{display:none}.canvas{flex:1;min-height:0;display:flex;background:var(--soft)}.canvas svg{display:block;width:100%;height:100%}.strip{display:flex;height:10px;flex:none}.legend{display:flex;flex-wrap:wrap;gap:4px 16px;padding:10px 16px 12px;font-size:12px;color:var(--muted);flex:none}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);margin-right:6px;vertical-align:-1px}.stage.full{position:fixed;inset:0;z-index:50;border:0;border-radius:0;padding-bottom:env(safe-area-inset-bottom,0px)}.stage.full .stage-bar{padding-top:calc(10px + env(safe-area-inset-top,0px))}.stage.full .nav-btn{display:inline-flex}.stage:fullscreen{width:100%;height:100%}body.lock{overflow:hidden}.panel{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:18px;padding:2px 2px 8px}.panel h3{margin:0 0 8px;font-size:13px;font-weight:600}.fields{display:flex;flex-direction:column;gap:8px}.fld{display:flex;align-items:center;gap:12px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px}.chip{position:relative;flex:none;width:46px;height:46px;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);cursor:pointer}.chip input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}.meta{flex:1;min-width:0}.meta .nm{display:block;font-size:13px;font-weight:500}.hexin{width:100%;max-width:120px;border:1px solid transparent;border-radius:6px;padding:2px 6px;margin-left:-6px;background:transparent;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em}.hexin:hover{border-color:var(--line)}.hexin:focus{border-color:var(--accent);outline:none;color:var(--ink)}.hexin.bad{border-color:var(--danger)}.err{margin:2px 0 0;font-size:12px;color:var(--danger);min-height:0}.err:empty{display:none}.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.pr{display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}.pr:hover{border-color:var(--muted)}.pr[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.pr .fan{display:flex;height:34px}.pr .fan span{flex:1}.pr .lbl{padding:6px 8px 7px;font-size:12px;line-height:1.35;color:var(--ink)}.copy{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px 12px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:500}.copy svg{width:16px;height:16px}.msg{margin:6px 0 0;font-size:12px;color:var(--ok);min-height:18px}.note{margin:0;font-size:12px;color:var(--muted)}@media (max-width:760px){header{padding:10px 12px}header h1{font-size:16px}main{grid-template-columns:1fr;grid-template-rows:minmax(0,58fr) minmax(0,42fr);gap:12px;padding:0 12px 12px}.panel{gap:14px}}@media (max-height:480px) and (orientation:landscape){main{grid-template-columns:minmax(0,1fr) 260px;grid-template-rows:none}header{padding:6px 12px}}@media (prefers-reduced-motion:no-preference){.tabs button,.pr,.icon-btn{transition:background-color .15s,border-color .15s,box-shadow .15s}}
</style></head><body><div class="app"><header><h1>Mô phỏng màu sơn nhà</h1><div class="tabs" id="tabs" role="tablist" aria-label="Khu vực"></div></header><main><section class="stage" id="stage" aria-labelledby="ttl"><div class="stage-bar"><button class="icon-btn nav-btn" id="prev" aria-label="Khu vực trước">‹</button><div class="t"><h2 id="ttl">Ngoại thất</h2><p>Mô phỏng, màu hiển thị gần đúng</p></div><button class="icon-btn nav-btn" id="next" aria-label="Khu vực tiếp theo">›</button><button class="icon-btn" id="fs" aria-label="Xem toàn màn hình">⛶</button></div><div class="canvas"><svg id="v-ext" viewBox="0 0 680 420" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mặt tiền ngôi nhà" style="--a:#F0EEE9;--b:#3A3F4A"><rect width="680" height="420" fill="#C9DDEE"/><rect x="0" y="395" width="680" height="25" fill="#D3D5D8"/><rect class="va" x="262" y="58" width="300" height="62"/><rect class="vb" x="258" y="52" width="308" height="7"/><rect class="vb" x="258" y="118" width="308" height="9"/><rect class="va" x="268" y="127" width="292" height="243"/><rect class="vb" x="262" y="140" width="298" height="9"/><rect class="va" x="560" y="128" width="105" height="242"/><rect class="vb" x="556" y="123" width="112" height="6"/><rect class="vb" x="556" y="165" width="112" height="7"/><rect class="va" x="40" y="135" width="228" height="235"/><rect x="110" y="225" width="80" height="145" fill="#2F3742" class="vbs" stroke-width="4"/><rect class="vb" x="18" y="72" width="250" height="56"/><rect class="vb" x="12" y="66" width="262" height="7"/><rect class="vb" x="12" y="126" width="262" height="9"/><path class="va" d="M80 135 H200 V182 Q140 128 80 182 Z"/><path d="M82 182 Q140 126 198 182" fill="none" class="vbs" stroke-width="6"/><circle class="vb" cx="140" cy="146" r="5"/><g id="cols"></g><rect x="340" y="205" width="110" height="115" fill="#2F3742" class="vbs" stroke-width="6"/><path d="M336 198 Q395 150 454 198" fill="none" class="vbs" stroke-width="6"/><circle class="vb" cx="395" cy="163" r="6"/><rect class="vb" x="326" y="205" width="5" height="112"/><rect class="vb" x="459" y="205" width="5" height="112"/><rect class="vb" x="330" y="322" width="130" height="7"/><rect class="vb" x="262" y="365" width="403" height="5"/><rect x="268" y="370" width="397" height="25" fill="#5B5F66"/><rect x="10" y="370" width="258" height="25" fill="#45494F"/></svg><svg id="v-liv" viewBox="0 0 680 420" preserveAspectRatio="xMidYMid meet" style="--a:#EEE5D3;--b:#4F6F6B;--c:#F7F5F0"><polygon class="vc" points="0,0 680,0 510,90 170,90"/><polygon class="va" points="0,0 170,90 170,310 0,420"/><polygon class="va" points="680,0 510,90 510,310 680,420"/><rect class="vb" x="170" y="90" width="340" height="220"/><polygon points="170,310 510,310 680,420 0,420" fill="#B48E68"/><rect x="225" y="226" width="230" height="40" rx="6" fill="#8C9096"/><rect x="215" y="262" width="250" height="40" rx="6" fill="#9AA0A6"/><rect x="290" y="132" width="100" height="62" fill="#F3EFE7" stroke="#5A4A3A" stroke-width="4"/><polygon points="210,325 470,325 540,392 140,392" fill="#DCD3C3"/><polygon points="282,338 398,338 414,358 266,358" fill="#6B5444"/></svg><svg id="v-bed" viewBox="0 0 680 420" preserveAspectRatio="xMidYMid meet" style="--a:#C7D3DF;--b:#8EA7BF;--c:#F7F7F5"><polygon class="vc" points="0,0 680,0 510,90 170,90"/><polygon class="va" points="0,0 170,90 170,310 0,420"/><polygon class="va" points="680,0 510,90 510,310 680,420"/><rect class="vb" x="170" y="90" width="340" height="220"/><polygon points="170,310 510,310 680,420 0,420" fill="#BE9C7A"/><rect x="255" y="195" width="170" height="72" rx="8" fill="#7A6656"/><polygon points="245,262 435,262 475,335 205,335" fill="#F4F1EA"/><polygon points="236,288 444,288 480,340 200,340" fill="#A8B4C0"/></svg><svg id="v-kit" viewBox="0 0 680 420" preserveAspectRatio="xMidYMid meet" style="--a:#EEE5D3;--b:#8B9B80;--c:#F7F5F0"><polygon class="vc" points="0,0 680,0 510,90 170,90"/><polygon class="va" points="0,0 170,90 170,310 0,420"/><polygon class="va" points="680,0 510,90 510,310 680,420"/><rect class="va" x="170" y="90" width="340" height="220"/><polygon points="170,310 510,310 680,420 0,420" fill="#D7D3CC"/><rect class="vb" x="190" y="108" width="300" height="62"/><rect x="190" y="170" width="300" height="64" fill="#F4F3EF"/><rect class="vb" x="190" y="244" width="300" height="62"/><polygon points="215,318 465,318 505,356 175,356" fill="#8A6A4E"/><rect x="175" y="356" width="330" height="10" fill="#6E5440"/></svg></div><div class="strip" id="bar"></div><div class="legend" id="lg"></div></section><aside class="panel"><section><h3>Màu sơn</h3><div class="fields" id="flds"></div></section><section><h3>Phối màu gợi ý</h3><div class="presets" id="pres"></div></section><section><button class="copy" id="cp">Sao chép mã màu</button><p class="msg" id="msg"></p><p class="note">Bấm vào ô màu để chọn, hoặc gõ mã màu đại lý đưa cho bạn. Màu bạn chọn được lưu lại trên máy này.</p></section></aside></main></div>
<script>const T=[{id:'ext',n:'Ngoại thất',w:[70,30],f:['Tường chính','Viền, phào chỉ'],v:['#F0EEE9','#3A3F4A'],p:[['Trắng ngà, viền xám than','#F0EEE9','#3A3F4A'],['Be kaki, viền nâu than','#D9CFBC','#5C4F47'],['Trắng kem, viền xanh ngọc khói','#EEE5D3','#4F6F6B'],['Trắng ngà, viền xanh bạch đàn','#F0EEE9','#6E7F63']]},{id:'liv',n:'Phòng khách',w:[60,30,10],f:['Tường chính','Tường nhấn','Trần, phào chỉ'],v:['#EEE5D3','#4F6F6B','#F7F5F0'],p:[['Trắng kem, nhấn xanh ngọc khói','#EEE5D3','#4F6F6B','#F7F5F0'],['Be kaki, nhấn nâu than','#D9CFBC','#5C4F47','#F5F2EC']]},{id:'bed',n:'Phòng ngủ',w:[60,30,10],f:['Tường chính','Tường đầu giường','Trần, phào chỉ'],v:['#C7D3DF','#8EA7BF','#F7F7F5'],p:[['Xanh dương nhạt, nhấn xanh dịu','#C7D3DF','#8EA7BF','#F7F7F5'],['Xanh lá xám, nhấn bạch đàn','#D5DBCD','#8B9B80','#F8F8F4']]},{id:'kit',n:'Bếp và phòng ăn',w:[60,30,10],f:['Tường chính','Tủ bếp','Trần, phào chỉ'],v:['#EEE5D3','#8B9B80','#F7F5F0'],p:[['Trắng kem, tủ xanh bạch đàn','#EEE5D3','#8B9B80','#F7F5F0'],['Trắng ngà, tủ xanh ngọc khói','#F0EEE9','#4F6F6B','#FAF9F6']]}];const K=['a','b','c'],KEY='mau-son-nha-v1',HEX=/^#?[0-9a-f]{6}$/i,$=id=>document.getElementById(id);T.forEach(t=>t.v=t.v.map(x=>x.toLowerCase()));let cur=T[0];T.forEach(t=>{const b=document.createElement('button');b.textContent=t.n;b.onclick=()=>show(t);$('tabs').appendChild(b)});function paint(t){const s=$('v-'+t.id);t.v.forEach((v,i)=>s.style.setProperty('--'+K[i],v));if(t!==cur)return;$('bar').innerHTML=t.v.map((v,i)=>'<span style="flex:'+t.w[i]+';background:'+v+'"></span>').join('');$('lg').innerHTML=t.f.map((n,i)=>'<span><i style="display:inline-block;width:10px;height:10px;background:'+t.v[i]+';margin-right:6px"></i>'+n+' '+t.w[i]+'%</span>').join('');document.querySelectorAll('.fld').forEach((l,i)=>{l.querySelector('.chip').style.background=t.v[i];l.querySelector('input[type=color]').value=t.v[i];l.querySelector('.hexin').value=t.v[i].toUpperCase()})}function save(){try{localStorage.setItem(KEY,JSON.stringify(Object.fromEntries(T.map(t=>[t.id,t.v]))))}catch(e){}}function setVal(t,i,v){t.v[i]=v.toLowerCase();paint(t);save()}function show(t){cur=t;$('ttl').textContent=t.n;T.forEach(x=>{$('v-'+x.id).style.display=x===t?'block':'none'});const F=$('flds');F.innerHTML='';t.f.forEach((n,i)=>{const w=document.createElement('div');w.innerHTML='<div class="fld"><label class="chip"><input type="color"></label><div class="meta"><span class="nm">'+n+'</span><input class="hexin" type="text" maxlength="7"></div></div>';const c=w.querySelector('input[type=color]'),h=w.querySelector('.hexin');c.addEventListener('input',e=>setVal(t,i,e.target.value));h.addEventListener('change',()=>{let v=h.value.trim();if(HEX.test(v)){if(v[0]!=='#')v='#'+v;setVal(t,i,v);h.value=v.toUpperCase()}});F.appendChild(w)});const P=$('pres');P.innerHTML='';t.p.forEach(p=>{const b=document.createElement('button');b.className='pr';b.innerHTML='<span class="fan">'+p.slice(1).map(c=>'<span style="flex:1;background:'+c+'"></span>').join('')+'</span><span class="lbl">'+p[0]+'</span>';b.onclick=()=>{t.v=p.slice(1).map(c=>c.toLowerCase());paint(t);save()};P.appendChild(b)});paint(t)}$('cp').onclick=()=>navigator.clipboard?.writeText(cur.n+': '+cur.f.map((n,i)=>n+' '+cur.v[i].toUpperCase()).join(', ')).then(()=>$('msg').textContent='Đã sao chép mã màu');$('fs').onclick=()=>{const s=$('stage');if(!s.classList.contains('full')){s.classList.add('full');document.body.classList.add('lock');s.requestFullscreen?.()}else{document.exitFullscreen?.();s.classList.remove('full');document.body.classList.remove('lock')}};show(cur);</script></body></html>
